<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body>
<video id="vid" src="background.mp4" muted autoplay playsinline></video>
<canvas id="c" width="100" height="100"></canvas>
<div id="output"></div>
<script>
window.testResults = [];
function log(msg) {
    window.testResults.push(msg);
    document.getElementById('output').innerHTML += '<p>' + msg + '</p>';
    console.log(msg);
}

const vid = document.getElementById('vid');
const c = document.getElementById('c');
const gl = c.getContext('webgl') || c.getContext('experimental-webgl');

if (!gl) {
    log('ERROR: WebGL not supported');
} else {
    log('WebGL context acquired');
}

function tryUpload() {
    log('Attempting texImage2D with video state readyState=' + vid.readyState);
    try {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, vid);
        log('SUCCESS: texImage2D succeeded with file:// video!');
    } catch(err) {
        log('ERROR: texImage2D failed: ' + err.name + ': ' + err.message);
    }
}

vid.addEventListener('loadeddata', () => {
    log('Video loadeddata fired');
    tryUpload();
});

vid.addEventListener('canplay', () => {
    log('Video canplay fired');
    tryUpload();
});

vid.addEventListener('error', (e) => {
    log('Video error: ' + (vid.error ? (vid.error.code + ' ' + vid.error.message) : 'unknown'));
});

setTimeout(() => {
    log('After 2s timeout: readyState=' + vid.readyState);
    tryUpload();
}, 2000);
</script>
</body>
</html>
